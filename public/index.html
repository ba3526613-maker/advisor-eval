<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3A57"><title>تقييم الموجّه الأكاديمي — مدارس باب المعرفة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7f7;--card:#fff;--tx:#17302f;--mut:#5d7472;--bd:#d9e4e3;--pri:#2a9d8f;--pri2:#3a7bbd;--ok:#4f9d3a;--soft:#e6f4f2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1a;--card:#172524;--tx:#e6f1f0;--mut:#93aeac;--bd:#2a3f3e;--soft:#1d3433}}
:root[data-theme="dark"]{--bg:#0f1a1a;--card:#172524;--tx:#e6f1f0;--mut:#93aeac;--bd:#2a3f3e;--soft:#1d3433}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
header img{height:64px;max-width:120px;object-fit:contain;border-radius:8px;background:#fff}
header h1{font-size:18px;margin:0}header p{margin:0;color:var(--mut);font-size:13px}
button,select,input{font-family:inherit;font-size:14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:4px 9px;font-size:12px}
input[type=text],input[type=number],select{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:12px}
.total{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big{font-size:34px;font-weight:700;color:var(--pri)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));width:0}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-top:12px;overflow:hidden}
.sec>h2{margin:0;padding:12px;font-size:16px;background:var(--soft);display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec>h2 span{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap}
.row{padding:12px;border-top:1px solid var(--bd)}
.row p{margin:0 0 6px;font-size:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.ex{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mut);margin:6px 0}
.ex b{color:var(--pri2)}
.files{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.f{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.f a{color:var(--pri2);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{width:64px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs .on{background:var(--pri);color:#fff}
.note{color:var(--mut);font-size:13px;text-align:center;padding:24px}
.hit{padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin-top:4px;cursor:pointer}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.up{width:100%;margin-top:8px;border:2px dashed var(--pri);background:var(--soft);color:var(--tx);border-radius:12px;padding:12px;cursor:pointer;font-family:inherit}.pa{display:none}@media print{@page{size:A4;margin:10mm}body{background:#fff!important;color:#000!important}.wrap{display:none!important}.pa{display:block;color:#000;font-size:11px}.ph{display:flex;align-items:center;gap:10px;border-bottom:2px solid #2a9d8f;padding-bottom:6px}.ph img{height:56px}.ph h2{margin:0;font-size:16px}.pi{display:flex;justify-content:space-between;margin:8px 0;gap:6px}.pt{width:100%;border-collapse:collapse}.pt th,.pt td{border:1px solid #444;padding:4px;text-align:center}.pt td.t{text-align:right}.pt th{background:#e6f4f2}.sg{display:flex;justify-content:space-between;margin-top:28px;text-align:center}}@media print{.btn,.tabs,#logoBtn,#out{display:none!important}}</style></head><body><div class="wrap">

 <div class="sg"><div>منسق/ـة البرنامج<br><br>..................</div><div>وكيل/ة المرحلة<br><br>..................</div><div>المشرف/ة التعليمي/ة<br><br>..................</div><div>مدير/ة المدرسة<br><br>..................</div></div>`;
 setTimeout(()=>print(),150)}
async function saveScores(o){await api("score?t="+sel.id+"&"+qs(),{method:"POST",body:JSON.stringify(o)});data.scores=o;render()}
$("main").addEventListener("change",e=>{const t=e.target;
 if(t.dataset.sc){const x=SECTIONS.flatMap(s=>s.r).find(r=>r.id===t.dataset.sc),v=Math.min(x.m,Math.max(0,+t.value||0)),okf=data.ev.some(f=>f.crit===x.id&&data.scores["v_"+f.fid]==="ok");if(v>0&&!okf&&!confirm("لا يوجد شاهد ("+ST.sOk+") لهذا البند. تأكيد الدرجة؟")){render();return}saveScores({...data.scores,[t.dataset.sc]:v})}
 else if(t.dataset.v)saveScores({...data.scores,["v_"+t.dataset.v]:t.value});
 else if(t.id==="msel"){month=t.value;loadData()}
 else if(t.dataset.nt)saveScores({...data.scores,["n_"+t.dataset.nt]:t.value});
 else if(t.id==="pd")saveScores({...data.scores,date:t.value});
 else if(t.id==="gn")saveScores({...data.scores,note:t.value})});
$("main").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 try{
 if(d.t){sel=teachers.find(t=>t.id===d.t);editing=adding=false;await loadData()}
 else if(d.settings){showSet=!showSet;render()}
 else if(d.stcancel){ST=JSON.parse(SAVED);applyST();showSet=false;render()}
 else if(d.stdef){ST={...DEF};applyST();render()}
 else if(d.stsave){ST=readST();applyST();const ok=await saveAll();SAVED=JSON.stringify(ST);$("stmsg").textContent=ok?"تم الحفظ لجميع المستخدمين ✓":"حُفظ على هذا الجهاز فقط (الخادم لم يقبل الإعدادات)"}
 else if(d.link){const u=location.origin+"/#t="+sel.id;try{await navigator.clipboard.writeText(u);b.textContent="تم النسخ ✓"}catch(_){prompt("انسخ:",u)}}
 else if(d.print)printForm();
 else if(d.close){if(confirm("اعتماد وإغلاق شهر "+mName(month)+" لهذا المعلم؟")){await api("close?t="+sel.id+"&"+qs(),{method:"POST"});await loadTeachers();await loadData()}}
 else if(d.reopen){if(confirm("إعادة فتح "+mName(month)+"؟")){await api("reopen?t="+sel.id+"&"+qs(),{method:"POST"});await loadTeachers();await loadData()}}
 else if(d.add){adding=!adding;editing=false;render()}
 else if(d.edit){editing=!editing;adding=false;render()}
 else if(d.cancel){editing=adding=false;render()}
 else if(d.rnd)$("f-k").value=rndCode();
 else if(d.invt){const v=prompt("نص الدعوة ({name} {link} {code}):",invTpl);if(v){invTpl=v;localStorage.setItem("inv",v)}}
 else if(d.copy){const m=invMsg(sel);try{await navigator.clipboard.writeText(m);b.textContent="تم النسخ ✓"}catch(_){prompt("انسخ:",m)}}
 else if(d.save!==undefined){const body={id:d.save||undefined,name:$("f-n").value.trim(),campus:$("f-c").value,stage:$("f-s").value,phone:$("f-p").value.trim(),code:$("f-k").value.trim()};
  try{const t=await api("teacher",{method:"POST",body:JSON.stringify(body)});sel=t;editing=adding=false;await loadTeachers();sel=teachers.find(x=>x.id===t.id);await loadData()}
  catch(x){$("ferr").textContent=String(x).includes("dup")?"الرمز مستخدم، غيّره":"تحقق من الاسم والرمز (4 خانات فأكثر)"}}
 else if(d.delt){if(confirm("حذف المعلم "+sel.name+" وكل شواهده؟")){await api("teacher?t="+sel.id,{method:"DELETE"});sel=null;await loadTeachers();sel=teachers[0]||null;await loadData()}}
 else if(d.up){const cx=SECTIONS.flatMap(s=>s.r).find(r=>r.id===d.up);if(!confirm("الشاهد سيُرفع للبند:\n«"+cx.t+"»\nتأكد أنه يخص هذا البند فقط. متابعة؟"))return;const i=document.createElement("input");i.type="file";i.multiple=true;i.onchange=async()=>{const fs=[...i.files];if(!fs.length)return;b.disabled=true;
   for(const f of fs){if(f.size>5*1024*1024){alert(f.name+": الحد الأقصى 5MB");continue}b.textContent="جارٍ رفع "+f.name+"…";try{await api(`upload?crit=${d.up}&name=${encodeURIComponent(f.name)}&type=${encodeURIComponent(f.type)}&${qs()}`,{method:"POST",body:f})}catch(_){alert("تعذّر رفع "+f.name)}}
   await loadData()};i.click()}
 else if(d.del&&confirm("حذف هذا الشاهد؟")){await api("evidence?f="+d.del+"&"+qs(),{method:"DELETE"});await loadData()}
 }catch(x){if(x==="auth"){localStorage.removeItem("code");location.reload()}else alert("حدث خطأ")}});
$("main").addEventListener("input",e=>{if(e.target.closest("#setp")){ST=readST();applyST()}});
if(code)api("me").then(r=>{role=r.role;boot(r)}).catch(()=>{});
</script></body></html>
